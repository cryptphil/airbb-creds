[package]
name = "airbnb_creds"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-bls12-381  = "0.4"
ark-ec         = "0.4"
ark-ff         = "0.4"
ark-std        = "0.4"
ark-serialize  = "0.4"
thiserror      = "1"
rand           = "0.8"
sha2           = "0.10"
zeroize        = { version = "1", features = ["derive"] }

[dev-dependencies]
ark-std = { version = "0.4", features = ["std"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
bbs_plus = "0.25.0"
dock_crypto_utils = "0.23.0"

[[bench]]
name = "signing"
harness = false

[[bench]]
name = "presentation"
harness = false

[[bench]]
name = "bbs"
harness = false